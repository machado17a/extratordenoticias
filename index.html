
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrator de Matérias Web</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .extractor-box {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #urlInput {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        #urlInput:focus {
            outline: none;
            border-color: #667eea;
        }

        #extractBtn {
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #extractBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        #extractBtn:active {
            transform: translateY(0);
        }

        #extractBtn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-box {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: none;
        }

        .result-box.show {
            display: block;
        }

        .article-title {
            font-weight: bold;
            font-size: 2em;
            color: #333;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .article-subtitle {
            font-style: italic;
            font-size: 1.3em;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .article-meta {
            display: flex;
            gap: 20px;
            padding: 15px 0;
            border-top: 2px solid #e0e0e0;
            border-bottom: 2px solid #e0e0e0;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .meta-item {
            color: #555;
            font-size: 0.95em;
        }

        .meta-label {
            font-weight: bold;
            color: #667eea;
        }

        .article-content {
            font-size: 1.1em;
            line-height: 1.8;
            color: #333;
            text-align: justify;
        }

        .article-content p {
            margin-bottom: 15px;
        }

        .error-message {
            background: #ff4444;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .copy-btn {
            margin-top: 20px;
            padding: 12px 30px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .copy-btn:hover {
            background: #218838;
        }

        .warning-box {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            font-size: 0.9em;
            color: #856404;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📰 Extrator de Matérias</h1>
            <p>Cole o link da matéria e extraia o conteúdo formatado</p>
        </div>

        <div class="extractor-box">
            <div class="warning-box">
                <strong>⚠️ Atenção:</strong> Este extrator funciona melhor com sites de notícias que permitem acesso público. Alguns sites podem bloquear a extração por motivos de segurança.
            </div>

            <div class="input-group">
                <input type="url" id="urlInput" placeholder="Cole aqui o link da matéria..." />
                <button id="extractBtn">Extrair</button>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Extraindo conteúdo...</p>
            </div>

            <div class="error-message" id="errorMessage"></div>
        </div>

        <div class="result-box" id="resultBox">
            <div id="articleTitle" class="article-title"></div>
            <div id="articleSubtitle" class="article-subtitle"></div>
            
            <div class="article-meta">
                <div class="meta-item" id="articleDate"></div>
                <div class="meta-item" id="articleAuthor"></div>
            </div>

            <div id="articleContent" class="article-content"></div>

            <button class="copy-btn" id="copyBtn">📋 Copiar Conteúdo</button>
        </div>
    </div>

    <script>
        const urlInput = document.getElementById('urlInput');
        const extractBtn = document.getElementById('extractBtn');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('errorMessage');
        const resultBox = document.getElementById('resultBox');
        const copyBtn = document.getElementById('copyBtn');

        let originalUrl = '';

        extractBtn.addEventListener('click', extractArticle);
        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') extractArticle();
        });
        copyBtn.addEventListener('click', copyContent);

        async function extractArticle() {
            const url = urlInput.value.trim();

            if (!url) {
                showError('Por favor, insira uma URL válida');
                return;
            }

            if (!isValidUrl(url)) {
                showError('URL inválida. Certifique-se de incluir http:// ou https://');
                return;
            }

            originalUrl = url;

            hideError();
            resultBox.classList.remove('show');
            loading.style.display = 'block';
            extractBtn.disabled = true;

            try {
                const proxyUrl = 'https://api.allorigins.win/raw?url=';
                const response = await fetch(proxyUrl + encodeURIComponent(url));

                if (!response.ok) {
                    throw new Error('Erro ao acessar a URL');
                }

                const html = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');

                const articleData = extractArticleData(doc);
                displayArticle(articleData);

            } catch (error) {
                showError('Erro ao extrair conteúdo: ' + error.message + '. Alguns sites bloqueiam a extração automática.');
            } finally {
                loading.style.display = 'none';
                extractBtn.disabled = false;
            }
        }

        function extractArticleData(doc) {
            let title = '';
            let subtitle = '';
            let date = '';
            let author = '';
            let content = '';

            const h1Element = doc.querySelector('h1');
            title = h1Element?.textContent?.trim() ||
                    doc.querySelector('[property="og:title"]')?.getAttribute('content') ||
                    doc.querySelector('title')?.textContent?.trim() ||
                    'Título não encontrado';

            const subtitleSelectors = [
                '.subtitle',
                '.sub-title',
                '.subheading',
                '.sub-heading',
                '.lead',
                '.deck',
                '.standfirst',
                '.article-subtitle',
                '.article-subheading',
                '.post-subtitle',
                '.article-deck',
                '.summary',
                'h2.subtitle',
                'p.subtitle',
                'p.lead',
                '[class*="subtitle"]',
                '[class*="subheading"]',
                '[class*="lead"]',
                '[class*="deck"]'
            ];

            for (let selector of subtitleSelectors) {
                const element = doc.querySelector(selector);
                if (element) {
                    subtitle = element.textContent?.trim() || '';
                    if (subtitle && subtitle !== title && subtitle.length > 10 && subtitle.length < 500) break;
                }
            }

            if (!subtitle && h1Element) {
                let nextElement = h1Element.nextElementSibling;
                let attempts = 0;
                while (nextElement && attempts < 5) {
                    const tagName = nextElement.tagName;
                    if (tagName === 'H2' || tagName === 'P' ||
                        (tagName === 'DIV' && nextElement.children.length === 0)) {
                        const text = nextElement.textContent?.trim();
                        if (text && text.length > 15 && text.length < 500 &&
                            text !== title && !text.match(/^(por|by|de|data|publicado)\s+/i)) {
                            subtitle = text;
                            break;
                        }
                    }
                    nextElement = nextElement.nextElementSibling;
                    attempts++;
                }
            }

            if (!subtitle) {
                const ogDesc = doc.querySelector('[property="og:description"]')?.getAttribute('content');
                const metaDesc = doc.querySelector('meta[name="description"]')?.getAttribute('content');
                subtitle = ogDesc || metaDesc || '';
            }

            const dateSelectors = [
                'time',
                '[datetime]',
                '.published-date',
                '.post-date',
                '.date',
                '.article-date',
                '.publish-date',
                '[property="article:published_time"]',
                'meta[property="article:published_time"]',
                '[class*="date"]',
                '[class*="publish"]'
            ];

            for (let selector of dateSelectors) {
                const element = doc.querySelector(selector);
                if (element) {
                    date = element.getAttribute('datetime') ||
                           element.getAttribute('content') ||
                           element.textContent?.trim();
                    if (date) break;
                }
            }

            const authorSelectors = [
                '[rel="author"]',
                '.author',
                '.author-name',
                '.byline',
                '.by-author',
                '.article-author',
                '.post-author',
                '.writer',
                '[itemprop="author"]',
                '[property="article:author"]',
                'meta[name="author"]',
                '[class*="author"]',
                '[class*="byline"]',
                'a[rel="author"]'
            ];

            for (let selector of authorSelectors) {
                const element = doc.querySelector(selector);
                if (element) {
                    author = element.getAttribute('content') || element.textContent?.trim();
                    if (author) {
                        author = author.replace(/^(por|by|de|escrito por|written by|autor|author)[\s:]+/i, '').trim();
                        if (author.length > 2 && author.length < 100) break;
                    }
                }
            }

            if (!author) {
                const allElements = doc.querySelectorAll('p, span, div');
                const authorPatterns = [
                    /^(?:Por|por|POR)\s+([A-ZÀÁÂÃÄÅÆÇÈÉÊËÌÍÎÏ][a-zàáâãäåæçèéêëìíîï]+(?:\s+[A-ZÀÁÂÃÄÅÆÇÈÉÊËÌÍÎÏa-zàáâãäåæçèéêëìíîï]+)+)/,
                    /^(?:By|BY|by)\s+([A-Z][a-z]+(?:\s+[A-Za-z]+)+)/,
                    /^(?:De|DE)\s+([A-ZÀÁÂÃÄÅÆÇÈÉÊËÌÍÎÏ][a-zàáâãäåæçèéêëìíîï]+(?:\s+[A-ZÀÁÂÃÄÅÆÇÈÉÊËÌÍÎÏa-zàáâãäåæçèéêëìíîï]+)+)/
                ];

                for (let element of allElements) {
                    const text = element.textContent?.trim();
                    if (text && text.length < 100) {
                        for (let pattern of authorPatterns) {
                            const match = text.match(pattern);
                            if (match && match[1]) {
                                author = match[1].trim();
                                if (author.length > 2 && author.length < 100) break;
                            }
                        }
                        if (author) break;
                    }
                }
            }

            const contentSelectors = [
                'article',
                '.article-content',
                '.post-content',
                '.entry-content',
                '.content',
                'main article',
                '[itemprop="articleBody"]',
                '.article-body',
                '.post-body'
            ];

            let contentElement = null;
            for (let selector of contentSelectors) {
                contentElement = doc.querySelector(selector);
                if (contentElement) break;
            }

            if (contentElement) {
                const paragraphs = contentElement.querySelectorAll('p');
                const contentArray = Array.from(paragraphs)
                    .map(p => p.textContent.trim())
                    .filter(text => text.length > 40);
                content = contentArray.join('\n\n');
            }

            if (!content || content.length < 200) {
                const allParagraphs = doc.querySelectorAll('p');
                const contentArray = Array.from(allParagraphs)
                    .map(p => p.textContent.trim())
                    .filter(text => text.length > 40);
                content = contentArray.join('\n\n');
            }

            return { title, subtitle, date, author, content };
        }

        function displayArticle(data) {
            document.getElementById('articleTitle').textContent = data.title;
            document.getElementById('articleSubtitle').textContent = data.subtitle;

            const dateElement = document.getElementById('articleDate');
            if (data.date) {
                dateElement.innerHTML = `<span class="meta-label">Data:</span> ${formatDate(data.date)}`;
                dateElement.style.display = 'block';
            } else {
                dateElement.style.display = 'none';
            }

            const authorElement = document.getElementById('articleAuthor');
            if (data.author) {
                authorElement.innerHTML = `<span class="meta-label">Autor:</span> ${data.author}`;
                authorElement.style.display = 'block';
            } else {
                authorElement.style.display = 'none';
            }

            const contentElement = document.getElementById('articleContent');
            if (data.content) {
                contentElement.setAttribute('data-raw-content', data.content);
                const paragraphs = data.content.split('\n\n');
                contentElement.innerHTML = paragraphs.map(p => `<p>${p}</p>`).join('');
            } else {
                contentElement.innerHTML = '<p><em>Não foi possível extrair o conteúdo completo da matéria.</em></p>';
            }

            resultBox.classList.add('show');
            resultBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function formatDate(dateString) {
            try {
                const date = new Date(dateString);
                if (isNaN(date.getTime())) return dateString;
                return date.toLocaleDateString('pt-BR', { 
                    year: 'numeric', 
                    month: 'long', 
                    day: 'numeric' 
                });
            } catch {
                return dateString;
            }
        }

        function copyContent() {
            const title = document.getElementById('articleTitle').textContent;
            const subtitle = document.getElementById('articleSubtitle').textContent;
            const dateText = document.getElementById('articleDate').textContent.replace('Data:', '').trim();
            const authorText = document.getElementById('articleAuthor').textContent.replace('Autor:', '').trim();

            const contentElement = document.getElementById('articleContent');
            const rawContent = contentElement.getAttribute('data-raw-content');
            const content = rawContent || Array.from(contentElement.querySelectorAll('p')).map(p => p.textContent.trim()).filter(t => t.length > 0).join('\n\n');

            let textToCopy = '';

            if (originalUrl) {
                textToCopy += `${originalUrl}\n\n`;
            }

            textToCopy += `*${title}*\n\n`;

            if (subtitle) {
                textToCopy += `_${subtitle}_\n\n`;
            }

            if (dateText) {
                textToCopy += `${dateText}\n`;
            }

            if (authorText) {
                textToCopy += `${authorText}\n`;
            }

            if (content) {
                textToCopy += `\n${content}`;
            }

            navigator.clipboard.writeText(textToCopy).then(() => {
                const originalText = copyBtn.textContent;
                copyBtn.textContent = '✅ Copiado!';
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                }, 2000);
            });
        }

        function isValidUrl(string) {
            try {
                const url = new URL(string);
                return url.protocol === 'http:' || url.protocol === 'https:';
            } catch {
                return false;
            }
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }

        function hideError() {
            errorMessage.classList.remove('show');
        }
    </script>
</body>
</html>
